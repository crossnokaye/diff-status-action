name: 'Diff Status Action'
description: |
  Marks specified statuses as successful if pull request changed files all match the specified globs.
  Use this action to exempt minor updates (e.g. documentation, tests) from deployment checks.
author: 'xeger'
inputs:
  app_id:
    description: 'GitHub App ID used to authenticate API requests'
    required: true
  private_key:
    description: 'GitHub App private key used to authenticate API requests'
    required: true
  globs:
    description: 'Newline-separated list of glob patterns to match against changed files'
    required: true
  statuses:
    description: 'Newline-separated list of status check names to update'
    required: true
outputs:
  all-match:
    description: 'Whether all changed files match the glob patterns (true/false)'
    value: ${{ steps.update-exempted-statuses.outputs.all-match }}
runs:
  using: 'composite'
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ github.repository_owner }}
    - name: Update exempted statuses
      id: update-exempted-statuses
      shell: bash
      env:
        INPUT_TOKEN: ${{ steps.app-token.outputs.token }}
        INPUT_GLOBS: ${{ inputs.globs }}
        INPUT_STATUSES: ${{ inputs.statuses }}
      run: node "${{ github.action_path }}/dist/index.js"
branding:
  icon: 'check-circle'
  color: 'green'
